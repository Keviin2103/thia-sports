    // Ordenar por hora
    function parseTimeToMinutes(timeStr) {
        const parts = timeStr.split(' ');
        const timePart = parts[0];
        const ampm = parts[1];
        const [hourStr, minuteStr] = timePart.split(':');
        let hour = parseInt(hourStr);
        const minute = parseInt(minuteStr);
        if (ampm === 'PM' && hour !== 12) hour += 12;
        if (ampm === 'AM' && hour === 12) hour = 0;
        return hour * 60 + minute;
    }
    for (let sport in picksData) {
        picksData[sport].sort((a, b) => parseTimeToMinutes(a.hora) - parseTimeToMinutes(b.hora));
    }

    function getConfianzaClass(conf) {
        if (conf >= 77) return 'confianza-alta';
        if (conf >= 73) return 'confianza-media';
        return 'confianza-baja';
    }
    function getEVClass(evStr) {
        if (!evStr || evStr === "N/A") return 'ev-badge ev-negativo';
        const val = parseFloat(evStr.replace('+','').replace('%',''));
        return !isNaN(val) && val >= 8 ? 'ev-badge' : 'ev-badge ev-negativo';
    }

    function createGameCardHTML(game) {
        const pitcherHTML = game.pitchers ? `<div class="pitcher-info"><i class="fas fa-baseball-ball"></i> ${game.pitchers}</div>` : '';
        const confianzaClass = getConfianzaClass(game.confianza);
        const evClass = getEVClass(game.ev_estimado);
        const evDisplay = game.ev_estimado || "N/A";
        return `
        <div class="game-card">
            <div class="card-header">
                <span class="liga-badge">${game.liga}</span>
                <span class="hora"><i class="far fa-clock"></i> ${game.hora}</span>
            </div>
            <div class="partido">${game.partido}</div>
            <span class="tipo-jugada">${game.tipo_jugada}</span>
            <div class="pick-principal">
                <div class="pick-label">🎯 Pick Principal</div>
                <div class="pick-value">${game.principal}</div>
                <div class="cuota-row"><span class="cuota-tag">Cuota: ${game.cuota_p}</span></div>
            </div>
            <div class="secundario-row">
                <span class="sec-label">📊 Secundario:</span> ${game.secundario}
                <span class="cuota-tag">${game.cuota_s}</span>
            </div>
            ${pitcherHTML}
            <div class="confianza-row">
                <span class="confianza-badge ${confianzaClass}">Confianza: ${game.confianza}%</span>
                <span class="${evClass}">EV: ${evDisplay}</span>
            </div>
            <div class="razonamiento-trigger">
                <i class="fas fa-lightbulb"></i> Ver razonamiento ThIA
                <span class="tooltip-content">${game.razonamiento}</span>
            </div>
        </div>`;
    }

    function createGridHTML(games) {
        return '<div class="grid">' + games.map(g => createGameCardHTML(g)).join('') + '</div>';
    }

    function updateStatsBar(games) {
        if (!games || games.length === 0) {
            document.getElementById('total-picks').textContent = '0';
            document.getElementById('avg-confianza').textContent = '0%';
            document.getElementById('avg-ev').textContent = '0%';
            document.getElementById('high-conf-count').textContent = '0';
            return;
        }
        const total = games.length;
        const avgConf = Math.round(games.reduce((s,g) => s + g.confianza, 0) / total);
        const evVals = games.map(g => parseFloat((g.ev_estimado||'').replace('+','').replace('%',''))).filter(v => !isNaN(v));
        const avgEV = evVals.length > 0 ? (evVals.reduce((s,v) => s + v, 0) / evVals.length).toFixed(1) : '0.0';
        const highConf = games.filter(g => g.confianza >= 75).length;
        document.getElementById('total-picks').textContent = total;
        document.getElementById('avg-confianza').textContent = avgConf + '%';
        document.getElementById('avg-ev').textContent = '+' + avgEV + '%';
        document.getElementById('high-conf-count').textContent = highConf;
    }

    function getAllPicks() {
        return Object.values(picksData).flat();
    }

    function generateSpecialParlays() {
        const all = getAllPicks().map(g => ({
            ...g,
            cuota: g.cuota_p,
            pick: g.principal,
            ev: parseFloat((g.ev_estimado||'0').replace('+','').replace('%','')) || 0
        })).sort((a,b) => b.confianza - a.confianza);
        const specials = [];

        const best = all[0];
        specials.push({
            id:'mejorpick', tipo:'mejorpick', nombre:'🌟 Mejor Pick del Día',
            descripcion:'Pick más confiable del día', legs:[best],
            cuotaTotal:best.cuota.toFixed(2), confProm:best.confianza,
            evTotal:'+' + best.ev.toFixed(1) + '%'
        });

        const highConf = all.filter(g => g.confianza >= 78);
        const morochaLegs = [];
        const used = new Set();
        for (let g of highConf) {
            if (morochaLegs.length >= 2) break;
            const sport = g.liga?.includes('MLB')?'MLB':g.liga?.includes('NBA')?'NBA':g.liga?.includes('NHL')?'NHL':'futbol';
            if (!used.has(sport) || morochaLegs.length===1) { morochaLegs.push(g); used.add(sport); }
        }
        if (morochaLegs.length >= 2) {
            const cuotaT = morochaLegs.reduce((p,g)=>p*g.cuota,1);
            const confP = Math.round(morochaLegs.reduce((s,g)=>s+g.confianza,0)/morochaLegs.length);
            const evT = morochaLegs.reduce((s,g)=>s+g.ev,0);
            specials.push({ id:'morocha', tipo:'morocha', nombre:'💎 La Morocha', descripcion:'Parlay de 2 picks de alta confianza', legs:morochaLegs, cuotaTotal:cuotaT.toFixed(2), confProm:confP, evTotal:'+'+evT.toFixed(1)+'%' });
        }

        const seguroLegs = all.filter(g => g.confianza >= 77).slice(0,4);
        if (seguroLegs.length >= 4) {
            const cuotaT = seguroLegs.reduce((p,g)=>p*g.cuota,1);
            const confP = Math.round(seguroLegs.reduce((s,g)=>s+g.confianza,0)/seguroLegs.length);
            const evT = seguroLegs.reduce((s,g)=>s+g.ev,0);
            specials.push({ id:'seguro', tipo:'seguro', nombre:'🔒 Parley Seguro (4 picks)', descripcion:'4 selecciones de alta seguridad', legs:seguroLegs, cuotaTotal:cuotaT.toFixed(2), confProm:confP, evTotal:'+'+evT.toFixed(1)+'%' });
        }

        const byEV = [...all].sort((a,b)=>b.ev-a.ev);
        const milloLengs = byEV.slice(0,5);
        if (milloLengs.length >= 5) {
            const cuotaT = milloLengs.reduce((p,g)=>p*g.cuota,1);
            const confP = Math.round(milloLengs.reduce((s,g)=>s+g.confianza,0)/milloLengs.length);
            const evT = milloLengs.reduce((s,g)=>s+g.ev,0);
            specials.push({ id:'millonario', tipo:'millonario', nombre:'💰 Millonario (5 picks)', descripcion:'Parlay de máximo EV, alto riesgo', legs:milloLengs, cuotaTotal:cuotaT.toFixed(2), confProm:confP, evTotal:'+'+evT.toFixed(1)+'%' });
        }
        return specials;
    }

    function renderParlayCard(parlay) {
        return `
        <div class="parlay-card ${parlay.tipo}">
            <span class="parlay-badge">${parlay.nombre.split(' ')[0]}</span>
            <h3>${parlay.nombre}</h3>
            <p class="parlay-subtitle">${parlay.descripcion} · ${parlay.legs.length} selecciones</p>
            <ul class="parlay-legs">
                ${parlay.legs.map(leg => `
                    <li>
                        <span class="leg-icon">✅</span>
                        <span><strong>${leg.pick}</strong> — ${leg.partido}</span>
                        <span style="color:var(--electric-light);margin-left:auto;font-weight:600;">${leg.cuota?.toFixed?.(2) || leg.cuota_p || leg.cuota}</span>
                    </li>
                `).join('')}
            </ul>
            <div class="parlay-metrics">
                <div class="parlay-metric"><span class="label">Cuota Total</span><span class="value cuota-total">${parlay.cuotaTotal}</span></div>
                <div class="parlay-metric"><span class="label">Confianza</span><span class="value">${parlay.confProm}%</span></div>
                <div class="parlay-metric"><span class="label">EV Est.</span><span class="value ev-positive">${parlay.evTotal}</span></div>
            </div>
        </div>`;
    }

    function generateAutoParlays(games) {
        if (!games || games.length < 3) return [];
        const allPicks = games.map(g => ({...g, cuota: g.cuota_p, pick: g.principal, ev: parseFloat((g.ev_estimado||'0').replace('+','').replace('%','')) || 0}));
        const sorted = [...allPicks].sort((a,b)=>b.confianza-a.confianza);
        const parlays = [];
        const conservador = sorted.filter(g=>g.confianza>=78).slice(0,3);
        if (conservador.length>=3) {
            const cuotaTotal = conservador.reduce((p,g)=>p*g.cuota,1).toFixed(2);
            parlays.push({ tipo:'conservador', nombre:'🛡️ Conservador', descripcion:'Alta seguridad', legs:conservador, cuotaTotal, confProm:Math.round(conservador.reduce((s,g)=>s+g.confianza,0)/3), evTotal:'+'+conservador.reduce((s,g)=>s+g.ev,0).toFixed(1)+'%' });
        }
        const balanceado = sorted.filter(g=>g.confianza>=74).slice(0,4);
        if (balanceado.length>=4) {
            const cuotaTotal = balanceado.reduce((p,g)=>p*g.cuota,1).toFixed(2);
            parlays.push({ tipo:'balanceado', nombre:'⚖️ Balanceado', descripcion:'Equilibrio riesgo-recompensa', legs:balanceado, cuotaTotal, confProm:Math.round(balanceado.reduce((s,g)=>s+g.confianza,0)/4), evTotal:'+'+balanceado.reduce((s,g)=>s+g.ev,0).toFixed(1)+'%' });
        }
        const agresivo = allPicks.filter(g=>g.ev>=9||g.cuota>=2.0).sort((a,b)=>b.ev-a.ev).slice(0,3);
        if (agresivo.length>=3) {
            const cuotaTotal = agresivo.reduce((p,g)=>p*g.cuota,1).toFixed(2);
            parlays.push({ tipo:'agresivo', nombre:'🚀 Agresivo', descripcion:'Máximo EV, alto riesgo', legs:agresivo, cuotaTotal, confProm:Math.round(agresivo.reduce((s,g)=>s+g.confianza,0)/3), evTotal:'+'+agresivo.reduce((s,g)=>s+g.ev,0).toFixed(1)+'%' });
        }
        return parlays;
    }

    function renderParlaysAll() {
        document.getElementById('subtabs-futbol').style.display = 'none';
        let html = '<div class="section-title"><i class="fas fa-layer-group"></i> Parlays Destacados del Día</div>';
        const specials = generateSpecialParlays();
        specials.forEach(p => html += renderParlayCard(p));
        html += '<h2 style="color:var(--electric-light); margin-top:2.5rem;">Parlays por Deporte</h2>';
        for (let sport in picksData) {
            const games = picksData[sport];
            const parlays = generateAutoParlays(games);
            if (parlays.length===0) continue;
            const emoji = { futbol:'⚽', mlb:'⚾', nba:'🏀', nhl:'🏒' }[sport] || '';
            html += `<h3 style="color:var(--electric-light); margin-top:1.8rem;">${emoji} ${sport.toUpperCase()}</h3>`;
            parlays.forEach(p => html += renderParlayCard(p));
        }
        document.getElementById('content').innerHTML = html;
        updateStatsBar(getAllPicks());
    }

    function renderGames(sport) {
        const container = document.getElementById('content');
        if (sport === 'parlays') { renderParlaysAll(); return; }
        const games = picksData[sport];
        if (!games || games.length===0) {
            container.innerHTML = '<p style="text-align:center;color:#aaa;padding:3rem;">No hay picks para este deporte.</p>';
            document.getElementById('subtabs-futbol').style.display = 'none';
            updateStatsBar([]);
            return;
        }
        if (sport === 'futbol') {
            const ligas = {};
            games.forEach(game => {
                if (!ligas[game.liga]) ligas[game.liga] = [];
                ligas[game.liga].push(game);
            });
            let subHTML = '';
            Object.keys(ligas).forEach((liga, i) => {
                subHTML += `<button class="sub-tab ${i===0?'active':''}" data-liga="${liga}">${liga}</button>`;
            });
            document.getElementById('subtabs-futbol').innerHTML = subHTML;
            document.getElementById('subtabs-futbol').style.display = 'flex';
            const firstLiga = Object.values(ligas)[0];
            container.innerHTML = createGridHTML(firstLiga);
            updateStatsBar(firstLiga);
        } else {
            document.getElementById('subtabs-futbol').style.display = 'none';
            const emoji = { mlb:'⚾', nba:'🏀', nhl:'🏒' }[sport] || '';
            container.innerHTML = `<div class="section-title">${emoji} ${sport.toUpperCase()} Picks • 8 Mayo 2026</div>` + createGridHTML(games);
            updateStatsBar(games);
        }
    }

    document.querySelectorAll('.main-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            renderGames(tab.getAttribute('data-sport'));
        });
    });
    document.addEventListener('click', (e) => {
        if (e.target.classList.contains('sub-tab')) {
            document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            const liga = e.target.getAttribute('data-liga');
            const ligaGames = picksData.futbol.filter(g => g.liga === liga);
            document.getElementById('content').innerHTML = createGridHTML(ligaGames);
            updateStatsBar(ligaGames);
        }
    });

    const hoy = new Date(2026, 4, 8); // 8 de mayo de 2026
    document.getElementById('fecha-hoy').innerHTML = `<i class="far fa-calendar-alt"></i> ${hoy.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}`;
    document.addEventListener('DOMContentLoaded', () => renderGames('futbol'));
</script>
